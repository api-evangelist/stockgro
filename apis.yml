aid: stockgro
name: StockGro
description: 'StockGro is an Indian stock market advisory, research and financial-education platform operated
  by Assetgro Fintech Private Limited and headquartered in Bengaluru. It is registered with SEBI as a
  Research Analyst (INH000018300) and delivers daily trade ideas with entry, exit and stop-loss levels
  authored by SEBI-registered research analysts, alongside a portfolio builder, live market data and stock
  pages, an advisors directory, and StockGro Academy courses used by 1,400+ educational institutions.
  Its AI assistant, Stoxo, answers market and research questions in conversational language. StockGro
  is an advisory and research platform connected to major Indian brokers for last-mile execution; it does
  not execute trades or hold client funds. StockGro publishes no public developer program: the company
  serves a substantive llms.txt for AI agents, and one internal FastAPI scoring service is publicly reachable
  at api.stockgro.club, but there is no documented API, portal, or SDK.'
